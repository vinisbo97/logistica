<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Fundo transparente em toda a volta, com badge central arredondada moderna ou texto direto -->
  <rect x="36" y="96" width="440" height="320" rx="72" fill="url(#grad)" filter="url(#shadow)" />
  <text x="256" y="295" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="135" fill="#FFFFFF" text-anchor="middle" letter-spacing="-3">PsLog</text>
</svg>